name: Android CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check repository hygiene
        run: |
          if git ls-files | grep -E '\.(apk|aab|jks|keystore)$|keystore\.properties'; then
            echo "Forbidden binary or signing file tracked in repository"
            exit 1
          fi

      - name: Run unit tests, Lint, and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --console=plain
