<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Mriya logo">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262D4D" />
      <stop offset="0.55" stop-color="#181D34" />
      <stop offset="1" stop-color="#101426" />
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A4369" />
      <stop offset="1" stop-color="#262D49" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14255C" />
      <stop offset="0.36" stop-color="#4B3AC4" />
      <stop offset="0.60" stop-color="#9B61D4" />
      <stop offset="0.80" stop-color="#FFB74D" />
      <stop offset="0.94" stop-color="#F58FA8" />
    </linearGradient>
    <linearGradient id="contrail" x1="37" y1="61.5" x2="49" y2="49.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85" />
    </linearGradient>
    <clipPath id="glass">
      <path d="M54,31 A16,16 0 0,1 70,47 L70,61 A16,16 0 0,1 54,77 A16,16 0 0,1 38,61 L38,47 A16,16 0 0,1 54,31 Z" />
    </clipPath>
  </defs>

  <!-- Rounded icon squircle backdrop -->
  <rect width="256" height="256" rx="56" fill="url(#wall)" />

  <g transform="scale(2.37037037)">
    <!-- Outer cabin window bevel -->
    <path d="M54,25 A22,22 0 0,1 76,47 L76,61 A22,22 0 0,1 54,83 A22,22 0 0,1 32,61 L32,47 A22,22 0 0,1 54,25 Z"
          fill="url(#bevel)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.9" />

    <!-- Recessed window frame -->
    <path d="M54,28.5 A18.5,18.5 0 0,1 72.5,47 L72.5,61 A18.5,18.5 0 0,1 54,79.5 A18.5,18.5 0 0,1 35.5,61 L35.5,47 A18.5,18.5 0 0,1 54,28.5 Z"
          fill="#1B213A" />

    <!-- Clipped glass viewport -->
    <g clip-path="url(#glass)">
      <rect x="38" y="31" width="32" height="46" fill="url(#sky)" />
      <path d="M36,72.0 Q54,67.2 72,72.0 L72,79 L36,79 Z" fill="#FFACC0" fill-opacity="0.90" />
      <path d="M36,73.3 Q54,68.6 72,73.3 L72,79 L36,79 Z" fill="#181F38" />
      <path d="M37,61.5 Q43.5,55.5 49.0,49.8" fill="none" stroke="url(#contrail)" stroke-linecap="round" stroke-width="1.35" />

      <!-- Bold Antonov An-225 Mriya silhouette (6 engines + high swept wings + twin H-tail) -->
      <g transform="translate(55.5 46.0) rotate(-30)" fill="#FFFFFF">
        <path d="M7.8,0 C7.8,-0.75 6.4,-1.05 4.8,-1.05 L2.4,-1.05 L-2.6,-8.0 L-3.8,-7.6 L-1.0,-1.05 L-5.2,-0.85 L-6.8,-3.85 L-7.7,-3.65 L-6.8,-0.6 L-7.4,0 L-6.8,0.6 L-7.7,3.65 L-6.8,3.85 L-5.2,0.85 L-1.0,1.05 L-3.8,7.6 L-2.6,8.0 L2.4,1.05 L4.8,1.05 C6.4,1.05 7.8,0.75 7.8,0 Z" />
        <path d="M2.6,-2.5 C2.6,-2.9 2.2,-3.05 1.4,-3.05 C0.6,-3.05 0.2,-2.9 0.2,-2.5 C0.2,-2.1 0.6,-1.95 1.4,-1.95 C2.2,-1.95 2.6,-2.1 2.6,-2.5 Z M1.3,-4.4 C1.3,-4.8 0.9,-4.95 0.1,-4.95 C-0.7,-4.95 -1.1,-4.8 -1.1,-4.4 C-1.1,-4.0 -0.7,-3.85 0.1,-3.85 C0.9,-3.85 1.3,-4.0 1.3,-4.4 Z M0.0,-6.3 C0.0,-6.7 -0.4,-6.85 -1.2,-6.85 C-2.0,-6.85 -2.4,-6.7 -2.4,-6.3 C-2.4,-5.9 -2.0,-5.75 -1.2,-5.75 C-0.4,-5.75 0.0,-5.9 0.0,-6.3 Z M2.6,2.5 C2.6,2.1 2.2,1.95 1.4,1.95 C0.6,1.95 0.2,2.1 0.2,2.5 C0.2,2.9 0.6,3.05 1.4,3.05 C2.2,3.05 2.6,2.9 2.6,2.5 Z M1.3,4.4 C1.3,4.0 0.9,3.85 0.1,3.85 C-0.7,3.85 -1.1,4.0 -1.1,4.4 C-1.1,4.8 -0.7,4.95 0.1,4.95 C0.9,4.95 1.3,4.8 1.3,4.4 Z M0.0,6.3 C0.0,5.9 -0.4,5.75 -1.2,5.75 C-2.0,5.75 -2.4,5.9 -2.4,6.3 C-2.4,6.7 -2.0,6.85 -1.2,6.85 C-0.4,6.85 0.0,6.7 0.0,6.3 Z" />
        <path d="M-5.2,-3.4 L-8.3,-3.4 L-8.5,-4.35 L-5.6,-4.35 Z M-5.2,3.4 L-5.6,4.35 L-8.5,4.35 L-8.3,3.4 Z" />
      </g>
    </g>

    <!-- Subtle glass inner rim -->
    <path d="M54,31 A16,16 0 0,1 70,47 L70,61 A16,16 0 0,1 54,77 A16,16 0 0,1 38,61 L38,47 A16,16 0 0,1 54,31 Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="0.8" />
  </g>
</svg>
